name: Emacs Lisp

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "lisp/**"
      - ".github/workflows/elisp.yml"
  pull_request:
    branches: [main]
    paths:
      - "lisp/**"
      - ".github/workflows/elisp.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        emacs-version: ["29.4", "30.2"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Emacs ${{ matrix.emacs-version }}
        uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: ${{ matrix.emacs-version }}

      - name: Run lint
        run: make -C lisp lint

      - name: Run tests
        run: make -C lisp test
