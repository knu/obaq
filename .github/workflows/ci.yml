name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "lisp/**"
      - "!lisp/.gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "lisp/**"
      - "!lisp/.gitignore"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npx prettier --check 'src/**/*.ts' 'test-vault/**/*.base'

      - name: Run tests
        run: npm test

  test-gate:
    name: Test
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix results
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          test "$RESULT" = success

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="${RUNNER_TEMP}/release-notes.md"
          awk -v ver="$version" '
            $0 == "## " ver { in_section = 1; next }
            /^## / { if (in_section) exit }
            in_section { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q "[^[:space:]]" "$notes"; then
            echo "Missing CHANGELOG section for version ${version}" >&2
            exit 1
          fi
          {
            echo "NOTES_PATH=$notes"
            echo "VERSION=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.notes.outputs.VERSION }}
          body_path: ${{ steps.notes.outputs.NOTES_PATH }}
